name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/cbt-api

jobs:
  build-api:
    name: Build API Docker Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-admin:
    name: Build Admin Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build admin panel
        run: pnpm --filter @cbt/admin build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_BUILD_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Upload admin build
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: apps/admin/dist/
          retention-days: 7

  build-siswa:
    name: Build Siswa PWA
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build siswa PWA
        run: pnpm --filter @cbt/siswa build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}
          VITE_BUILD_VERSION: ${{ github.sha }}
          VITE_BUILD_TIMESTAMP: ${{ github.event.head_commit.timestamp }}

      - name: Upload siswa build
        uses: actions/upload-artifact@v4
        with:
          name: siswa-dist
          path: apps/siswa/dist/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-admin, build-siswa]
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment: staging
    timeout-minutes: 10

    steps:
      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist/

      - name: Download siswa build
        uses: actions/download-artifact@v4
        with:
          name: siswa-dist
          path: siswa-dist/

      # Deploy steps depend on hosting provider
      # Example: Deploy frontend to Cloudflare Pages / Vercel / S3
      - name: Deploy frontends
        run: |
          echo "Deploy admin-dist/ and siswa-dist/ to CDN"
          echo "Pull and restart API container with new image tag"
          echo "Actual deployment commands depend on your infrastructure"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-api, build-admin, build-siswa]
    if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.environment == 'production'
    environment: production
    timeout-minutes: 10

    steps:
      - name: Download admin build
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: admin-dist/

      - name: Download siswa build
        uses: actions/download-artifact@v4
        with:
          name: siswa-dist
          path: siswa-dist/

      - name: Deploy to production
        run: |
          echo "Deploy to production infrastructure"
          echo "Run database migrations"
          echo "Update API container"
          echo "Deploy static frontends"
          echo "Invalidate CDN cache"
