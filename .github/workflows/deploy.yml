# Push ke main -> build image di GitHub -> VPS pull image baru & restart layanan cbt.
# Bisa juga dijalankan manual: tab Actions -> Deploy VPS -> Run workflow.
# (Menggantikan workflow lama: edu = Railway, cbt = placeholder echo.)
name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/ferdianalfarezi

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: cbt-api
            file: Dockerfile
            build-args: ""
          - name: cbt-admin
            file: Dockerfile.admin
            build-args: |
              VITE_API_URL=https://cbt-api.teman-sekolah.com/api/v1
              VITE_LMS_API_URL=https://api.teman-sekolah.com/api/v1
          - name: cbt-siswa
            file: Dockerfile.siswa
            build-args: |
              VITE_API_URL=https://cbt-api.teman-sekolah.com/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          build-args: ${{ matrix.build-args }}
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy ke VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    steps:
      - name: Pull & restart di VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          KNOWN_HOST: "202.155.136.27 ssh-rsa "
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOST" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$ACTOR" "$TOKEN" | ssh root@202.155.136.27 cbt
